services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flightcomp
      POSTGRES_PASSWORD: flightcomp
      POSTGRES_DB: flight_compensation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightcomp -d flight_compensation"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://flightcomp:flightcomp@db:5432/flight_compensation
      CORS_ORIGINS: http://localhost:3000,https://flight-compensation-platform.vercel.app
      ADMIN_API_KEY: dev-admin-key-change-me
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
