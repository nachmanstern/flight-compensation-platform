services:
  - type: web
    name: flight-compensation-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-compensation-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true

databases:
  - name: flight-compensation-db
    plan: free
